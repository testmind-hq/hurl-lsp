name: Publish crate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the crate without publishing to crates.io"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate crate package
        if: ${{ inputs.dry_run == true }}
        run: cargo publish --package hurl-lsp --locked --dry-run
      - name: Publish crate to crates.io
        if: ${{ inputs.dry_run != true }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --package hurl-lsp --locked
